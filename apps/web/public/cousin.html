            <input ref={dataFileRef} type="file" accept=".json" style={{ display: "none" }} onChange={function(e) { var f = e.target.files[0]; if (!f) return; var reader = new FileReader(); reader.onload = function(ev) { try { var data = JSON.parse(ev.target.result); if (data._format && data._format.indexOf("citizen-science") >= 0 && data.reports) { var csObs = citizenScienceToObservations(data); setObservedData(csObs); } else if (data.observations) { setObservedData(data.observations); } else { setObservedData(data); } } catch(err) { alert("Invalid JSON: " + err.message); } }; reader.readAsText(f); e.target.value = ""; }} />
          </div>
          {Object.entries(CALIBRATION_TARGETS).map(function(entry) {
            var metric = entry[0], targets = entry[1];
            var modelVal = metric === "orcaPopulation" ? (es.orcaPopulation !== undefined ? es.orcaPopulation : 74) : metric === "dissolvedOxygen" ? ms.dissolvedOxygen : metric === "hoodCanalDO" ? ms.pugetSoundDO : metric === "sst" ? ms.sst : metric === "salmonRun" ? es.salmonRunStrength : metric === "georgiaDO" ? (basins.georgia ? basins.georgia.DO : 7) : metric === "georgiaSST" ? (basins.georgia ? basins.georgia.SST : 10) : metric === "whidbeyDO" ? (basins.whidbey ? basins.whidbey.DO : 7) : metric === "mainBasinDO" ? (basins.mainBasin ? basins.mainBasin.DO : 7) : metric === "mainBasinSST" ? (basins.mainBasin ? basins.mainBasin.SST : 11) : metric === "southSoundDO" ? (basins.southSound ? basins.southSound.DO : 6) : metric === "sanjuanSST" ? (basins.sanjuan ? basins.sanjuan.SST : 10) : metric === "georgiaSalinity" ? (basins.georgia ? basins.georgia.salinity : 25) : metric === "hoodCanalpH" ? (basins.hoodCanal ? basins.hoodCanal.pH : 8) : metric === "juanDeFucaDO" ? (basins.juanDeFuca ? basins.juanDeFuca.DO : 8) : metric === "juanDeFucaSST" ? (basins.juanDeFuca ? basins.juanDeFuca.SST : 10) : metric === "juanDeFucaSalinity" ? (basins.juanDeFuca ? basins.juanDeFuca.salinity : 31) : 0;
            var closest = targets.reduce(function(best, t) { return Math.abs(t.yr - year) < Math.abs(best.yr - year) ? t : best; }, targets[0]);
            var err = modelVal - closest.v;
            var errPct = closest.v !== 0 ? (err / closest.v * 100).toFixed(1) : "—";
            // Sparkline of targets
            var sparkW = 160, sparkH = 28;
            var allYrs = targets.map(function(t) { return t.yr; });
            var allVals = targets.map(function(t) { return t.v; });
            var minY = Math.min.apply(null, allYrs), maxY = Math.max.apply(null, allYrs.concat([year]));
            var minV = Math.min.apply(null, allVals.concat([modelVal])) * 0.9, maxV = Math.max.apply(null, allVals.concat([modelVal])) * 1.1;
            var rangeY = Math.max(maxY - minY, 1), rangeV = Math.max(maxV - minV, 0.01);
            return (
              <div key={metric} style={{ marginBottom: 8, padding: "6px 10px", borderRadius: 6, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 11, fontWeight: 600 }}>{metric.replace(/([A-Z])/g, " $1").trim()}</span>
                  <span style={{ fontSize: 9, fontFamily: "var(--font-mono)", color: Math.abs(err) < (closest.u || closest.v * 0.1) ? "#2d7a4f" : "#A32D2D" }}>
                    Model: {modelVal.toFixed(1)} | Obs: {closest.v.toFixed(1)} (±{closest.u.toFixed(1)}) | Err: {errPct}%
                  </span>
                </div>
                <svg width={sparkW} height={sparkH} style={{ display: "block", marginTop: 4 }}>
                  {/* Observed data points */}
                  {targets.map(function(t, i) {
                    var x = ((t.yr - minY) / rangeY) * (sparkW - 10) + 5;
                    var y = sparkH - ((t.v - minV) / rangeV) * (sparkH - 6) - 3;
                    return <g key={i}>
                      {t.u > 0 && <line x1={x} y1={sparkH - ((t.v - t.u - minV) / rangeV) * (sparkH - 6) - 3} x2={x} y2={sparkH - ((t.v + t.u - minV) / rangeV) * (sparkH - 6) - 3} stroke="var(--color-text-tertiary)" strokeWidth="0.8" />}
                      <circle cx={x} cy={y} r="2.5" fill="#378ADD" stroke="white" strokeWidth="0.5" />
                    </g>;
                  })}
                  {/* Model value at current year */}
                  {year >= minY && year <= maxY + 10 && (function() {
                    var mx = cl(((year - minY) / rangeY) * (sparkW - 10) + 5, 5, sparkW - 5);
                    var my = sparkH - ((modelVal - minV) / rangeV) * (sparkH - 6) - 3;
                    return <g><circle cx={mx} cy={my} r="3" fill="#A32D2D" stroke="white" strokeWidth="0.5" /><text x={mx + 5} y={my + 3} fontSize="7" fill="#A32D2D">model</text></g>;
                  })()}
                </svg>
                <div style={{ fontSize: 8, color: "var(--color-text-tertiary)" }}>Source: {targets.map(function(t) { return t.src; }).filter(function(v, i, a) { return a.indexOf(v) === i; }).join(", ")}</div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── SENSITIVITY ANALYSIS ── */}
      {researchTab === "sens" && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>One-at-a-time (OAT) sensitivity analysis</div>
          <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginBottom: 8 }}>Vary one parameter across its full range while holding all others at current values. Shows response surface for the selected output metric.</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
            <label style={{ fontSize: 10 }}>
              <span style={{ color: "var(--color-text-tertiary)", display: "block", fontSize: 9, marginBottom: 2 }}>Input parameter</span>
              <select value={sensParam} onChange={function(e) { setSensParam(e.target.value); setSensResult(null); }}
                style={{ fontSize: 10, padding: "3px 6px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }}>
                {paramPaths.map(function(p) { return <option key={p} value={p}>{p}</option>; })}
              </select>
            </label>
            <label style={{ fontSize: 10 }}>
              <span style={{ color: "var(--color-text-tertiary)", display: "block", fontSize: 9, marginBottom: 2 }}>Output metric</span>
              <select value={sensOutput} onChange={function(e) { setSensOutput(e.target.value); setSensResult(null); }}
                style={{ fontSize: 10, padding: "3px 6px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }}>
                {Object.entries(outputLabels).map(function(e) { return <option key={e[0]} value={e[0]}>{e[1]}</option>; })}
              </select>
            </label>
            <button onClick={doSensitivity} disabled={sensRunning}
              style={{ padding: "4px 14px", fontSize: 10.5, borderRadius: 5, fontWeight: 500, border: "1px solid var(--color-border-tertiary)", background: sensRunning ? "var(--color-background-secondary)" : "var(--color-background-info)", color: sensRunning ? "var(--color-text-tertiary)" : "var(--color-text-info)", cursor: sensRunning ? "wait" : "pointer" }}>
              {sensRunning ? "Running 15 sims..." : "Run sweep"}
            </button>
          </div>
          {sensResult && (function() {
            var pts = sensResult.results;
            var outVals = pts.map(function(p) { return p.output; });
            var minOut = Math.min.apply(null, outVals), maxOut = Math.max.apply(null, outVals);
            var rangeOut = Math.max(maxOut - minOut, 0.001);
            var chartW = 460, chartH = 140;
            var polyPts = pts.map(function(p, i) {
              var x = (i / (pts.length - 1)) * chartW;
              var y = chartH - 16 - ((p.output - minOut) / rangeOut) * (chartH - 24);
              return x + "," + y;
            }).join(" L");
            // Baseline position
            var baseIdx = pts.reduce(function(best, p, i) { return Math.abs(p.paramVal - sensResult.baseVal) < Math.abs(pts[best].paramVal - sensResult.baseVal) ? i : best; }, 0);
            var baseX = (baseIdx / (pts.length - 1)) * chartW;
            return (
              <div>
                <div style={{ fontSize: 10, fontWeight: 500, marginBottom: 4 }}>{sensResult.label} ({sensResult.lo.toFixed(1)}–{sensResult.hi.toFixed(1)} {sensResult.unit}) → {outputLabels[sensOutput]}</div>
                <svg width="100%" viewBox={"0 0 " + chartW + " " + chartH} style={{ display: "block", background: "var(--color-background-primary)", borderRadius: 6, border: "1px solid var(--color-border-tertiary)" }}>
                  <line x1={baseX} y1="0" x2={baseX} y2={chartH} stroke="var(--color-text-tertiary)" strokeWidth="0.8" strokeDasharray="4 3" opacity="0.4" />
                  <text x={baseX} y="10" fontSize="7" fill="var(--color-text-tertiary)" textAnchor="middle">current</text>
                  <polyline points={polyPts} fill="none" stroke="#378ADD" strokeWidth="2" />
                  {pts.map(function(p, i) {
                    var x = (i / (pts.length - 1)) * chartW;
                    var y = chartH - 16 - ((p.output - minOut) / rangeOut) * (chartH - 24);
                    return <circle key={i} cx={x} cy={y} r="2.5" fill="#378ADD" stroke="white" strokeWidth="0.8" />;
                  })}
                  <text x="4" y={chartH - 4} fontSize="7" fill="var(--color-text-tertiary)">{sensResult.lo.toFixed(1)}</text>
                  <text x={chartW - 4} y={chartH - 4} fontSize="7" fill="var(--color-text-tertiary)" textAnchor="end">{sensResult.hi.toFixed(1)}</text>
                  <text x="4" y="10" fontSize="7" fill="var(--color-text-tertiary)">{maxOut.toFixed(1)}</text>
                  <text x="4" y={chartH - 16} fontSize="7" fill="var(--color-text-tertiary)">{minOut.toFixed(1)}</text>
                </svg>
                <div style={{ fontSize: 9, color: "var(--color-text-tertiary)", marginTop: 4 }}>Sensitivity: Δoutput/Δparam = {((outVals[outVals.length - 1] - outVals[0]) / (sensResult.hi - sensResult.lo)).toFixed(4)} per unit. Range: {minOut.toFixed(2)} – {maxOut.toFixed(2)}</div>
              </div>
            );
          })()}
        </div>
      )}

      {/* ── BATCH SWEEP ── */}
      {researchTab === "batch" && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>Batch parameter sweep</div>
          <div style={{ fontSize: 10, color: "var(--color-text-tertiary)", marginBottom: 8 }}>Sweep one parameter across its range, run full multi-year simulation at each step, report terminal values for all key outputs.</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap", alignItems: "flex-end" }}>
            <label style={{ fontSize: 10 }}>
              <span style={{ color: "var(--color-text-tertiary)", display: "block", fontSize: 9, marginBottom: 2 }}>Parameter</span>
              <select value={batchParam} onChange={function(e) { setBatchParam(e.target.value); setBatchResult(null); }}
                style={{ fontSize: 10, padding: "3px 6px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }}>
                {paramPaths.map(function(p) { return <option key={p} value={p}>{p}</option>; })}
              </select>
            </label>
            <label style={{ fontSize: 10 }}>
              <span style={{ color: "var(--color-text-tertiary)", display: "block", fontSize: 9, marginBottom: 2 }}>Years</span>
              <input type="number" value={batchYears} min={5} max={50} step={5} onChange={function(e) { setBatchYears(Number(e.target.value) || 10); setBatchResult(null); }}
                style={{ width: 40, fontSize: 10, fontFamily: "var(--font-mono)", padding: "3px 4px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
            </label>
            <label style={{ fontSize: 10 }}>
              <span style={{ color: "var(--color-text-tertiary)", display: "block", fontSize: 9, marginBottom: 2 }}>Steps</span>
              <input type="number" value={batchSteps} min={5} max={21} step={2} onChange={function(e) { setBatchSteps(Number(e.target.value) || 11); setBatchResult(null); }}
                style={{ width: 36, fontSize: 10, fontFamily: "var(--font-mono)", padding: "3px 4px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
            </label>
            <button onClick={doBatch} disabled={batchRunning}
              style={{ padding: "4px 14px", fontSize: 10.5, borderRadius: 5, fontWeight: 500, border: "1px solid var(--color-border-tertiary)", background: batchRunning ? "var(--color-background-secondary)" : "var(--color-background-info)", color: batchRunning ? "var(--color-text-tertiary)" : "var(--color-text-info)", cursor: batchRunning ? "wait" : "pointer" }}>
              {batchRunning ? "Running " + batchSteps + " × " + batchYears + "yr..." : "Run batch"}
            </button>
          </div>
          {batchResult && (function() {
            var pts = batchResult.results;
            var metrics = [
              { k: "wqi", l: "Water Quality", c: "#378ADD" }, { k: "bio", l: "Biodiversity", c: "#1D9E75" },
              { k: "orca", l: "Orca Pop", c: "#534AB7" }, { k: "salmon", l: "Salmon Run", c: "#D85A30" },
              { k: "do", l: "DO (mg/L)", c: "#639922" }, { k: "equity", l: "Equity", c: "#BA7517" },
            ];
            var chartW = 460, chartH = 120;
            return (
              <div>
                <div style={{ fontSize: 10, fontWeight: 500, marginBottom: 4 }}>{batchResult.label} ({batchResult.lo.toFixed(1)}–{batchResult.hi.toFixed(1)} {batchResult.unit}) · {batchResult.years} years per step · {pts.length} runs</div>
                {metrics.map(function(m) {
                  var vals = pts.map(function(p) { return p[m.k]; });
                  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
                  var rangeV = Math.max(maxV - minV, 0.001);
                  var poly = pts.map(function(p, i) {
                    var x = (i / (pts.length - 1)) * chartW;
                    var y = chartH - 14 - ((p[m.k] - minV) / rangeV) * (chartH - 22);
                    return x + "," + y;
                  }).join(" L");
                  return (
                    <div key={m.k} style={{ marginBottom: 4 }}>
                      <div style={{ fontSize: 9, fontWeight: 500, color: m.c }}>{m.l} ({minV.toFixed(1)} – {maxV.toFixed(1)})</div>
                      <svg width="100%" viewBox={"0 0 " + chartW + " 36"} style={{ display: "block" }}>
                        <polyline points={pts.map(function(p, i) { var x = (i / (pts.length - 1)) * chartW; var y = 34 - ((p[m.k] - minV) / rangeV) * 30; return x + "," + y; }).join(" L")} fill="none" stroke={m.c} strokeWidth="1.5" />
                      </svg>
                    </div>
                  );
                })}
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 8, color: "var(--color-text-tertiary)" }}>
                  <span>{batchResult.lo.toFixed(1)} {batchResult.unit}</span>
                  <span>Current: {batchResult.baseVal.toFixed(1)}</span>
                  <span>{batchResult.hi.toFixed(1)} {batchResult.unit}</span>
                </div>
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// EDUCATIONAL MODE DATA
// ═══════════════════════════════════════════════════════════
var GLOSSARY = {
  "Water quality": "How clean and healthy the ocean water is — affected by pollution, runoff, and sewage",
  "Biodiversity": "The variety of living things in the ecosystem — more species means a healthier system",
  "Orca viability": "How well the Southern Resident orca whales are doing — they need salmon, quiet waters, and clean oceans",
  "Social equity": "Whether environmental problems affect all communities fairly, or if some neighborhoods suffer more",
  "Dissolved oxygen": "The amount of oxygen in the water that fish and sea creatures need to breathe",
  "SST": "Sea Surface Temperature — how warm the ocean is. Warmer water holds less oxygen",
  "pH": "How acidic the water is. Lower pH (more acidic) makes it harder for shellfish to build shells",
  "CSO events": "Combined Sewer Overflows — when heavy rain overwhelms sewers and raw sewage flows into the sea",
  "Salmon run": "The number of salmon returning to rivers to spawn. Orcas depend on salmon for food",
  "Kelp health": "How well underwater kelp forests are doing — they provide habitat for hundreds of species",
  "Stratification": "When warm fresh water sits on top of cold salty water, preventing mixing and trapping pollution below",
  "Impervious surface": "Hard surfaces like roads and parking lots that prevent rain from soaking into the ground",
  "Riparian buffer": "Trees and plants along riverbanks that filter pollution before it reaches the water",
  "Hood Canal": "A long narrow fjord in Puget Sound that flushes very slowly — pollution gets trapped here",
  "Juan de Fuca Strait": "The 154 km channel connecting the Salish Sea to the Pacific Ocean — the system's primary gateway. Dominated by strong tidal currents (83-86% of variance) and a two-layer estuarine exchange: fresh surface water flows seaward while dense, nutrient-rich, oxygen-moderate Pacific water flows landward at depth. This deep inflow (comparable in volume to the Amazon River) renews bottom water in all interior basins. Coastal upwelling on the Washington/Oregon shelf modulates the properties of this inflowing water — during summer upwelling, the deep water is colder, saltier, nutrient-rich, and oxygen-poor. The Columbia River plume episodically intrudes during winter southerly winds. Also the primary shipping lane for all commercial traffic entering the Salish Sea",
  "First flush": "The first heavy rain after summer washes months of built-up pollution off streets into waterways",
  "Reservoir": "Water storage — fills up in winter rains, depletes in summer when people use more water",
  "Drought stress": "When there isn't enough fresh water for people and nature — worse in dry summers",
  "Ferry noise": "Sound from Washington State Ferries that can disturb marine mammals like orcas",
  "Eelgrass": "Zostera marina — underwater meadows in shallow water that are critical nursery habitat for herring and juvenile salmon. Exhibits hysteresis: declines rapidly under stress but recovers very slowly. Below 30% establishment, seedbank depletion triggers a regime shift making recovery functionally impossible",
  "Eelgrass restoration": "Active intervention to rebuild eelgrass meadows through shoot transplanting, seed broadcasting, and sediment stabilization. Boosts natural recovery rate up to 5× and provides cascading benefits: herring spawning habitat, juvenile crab nursery, salmon prey base, coastal erosion protection, and sediment trapping that reduces turbidity. A nature-based solution inspired by the EU Digital Twin Ocean's seagrass protection demonstrator. Requires 8+ years for full establishment — prevention of loss is far more cost-effective than restoration",
  "Bull kelp": "Nereocystis luetkeana — tall kelp forests that shelter hundreds of species. Sensitive to warm water and sea urchin grazing",
  "Green crab": "Carcinus maenas — invasive European green crab first detected in the inner Salish Sea in 2019. Shreds eelgrass roots, preys on juvenile shellfish and Dungeness crab. Population grows faster in warmer water, making climate change a force multiplier for this invasion",
  "Dungeness crab": "Metacarcinus magister — the most valuable single-species fishery in the PNW (~$250M/yr). Sensitive to low dissolved oxygen (lethal below 2 mg/L), ocean acidification (shell formation needs Ω > 1.0), and green crab predation on juveniles. Juveniles depend on eelgrass habitat",
  "Pacific oyster": "Crassostrea gigas — introduced from Japan, now the dominant commercial oyster in the PNW (~$150M/yr). Larval shell formation fails below Ω ≈ 1.5, making it the sentinel species for ocean acidification impacts. Each adult filters ~190L/day, creating a population-level water filtration feedback: more oysters → clearer water → better eelgrass → more herring",
  "Olympia oyster": "Ostrea lurida — the only native oyster, reduced to <5% of historical abundance by over-harvest and habitat loss. Extremely slow recovery (r=0.06/yr). Restoration tied to protected areas and eelgrass habitat. A cultural keystone for Coast Salish tribes who managed oyster beds for millennia",
  "Sand lance": "Ammodytes personatus — forage fish that spawns in sandy subtidal sediment. Destroyed by dredging and bottom disturbance. Primary prey for marbled murrelets, rhinoceros auklets, and juvenile salmon. Occupies a different habitat niche than herring (subtidal sand vs. eelgrass)",
  "Surf smelt": "Hypomesus pretiosus — forage fish that spawns on upper-beach gravel, directly destroyed by shoreline armoring (seawalls, bulkheads). 53% of Puget Sound shoreline is armored, making this the species most affected by coastal development. Riparian restoration and shoreline softening are the primary recovery levers",
  "Forage fish": "The three pillars of the Salish Sea food web: herring (eelgrass spawner), sand lance (subtidal sand spawner), and surf smelt (upper-beach gravel spawner). Each depends on different habitat, so a single stressor rarely crashes all three simultaneously — unless it is a region-wide event like an oil spill or marine heat wave",
  "Rockfish": "Sebastes spp. — copper, quillback, and yelloweye rockfish, among the longest-lived vertebrates (yelloweye: 120+ years). Fished to <5% of historical in Puget Sound. Extremely slow recovery (mature at 15-20 years, r=0.03/yr). The species that demonstrates why MPAs need decades to work. Sensitive to deep-water DO, and bioaccumulates PCBs/PFAS over century-long lifespans",
  "Sea urchin": "Strongylocentrotus spp. — purple and red urchins are the primary grazers controlling kelp forest extent. When predators decline (sea star wasting disease removed sunflower stars in 2013-14), urchin populations explode and create 'urchin barrens' — overgrazed reefs with no kelp canopy. The barren threshold is nonlinear: moderate urchins are healthy, but above ~60% density, kelp cannot recover. A small but growing uni export fishery provides some harvest pressure",
  "Geoduck": "Panopea generosa — the world's longest-lived bivalve (160+ years), buried 1m deep in subtidal sediment. Major tribal co-managed export fishery (~$80M/yr to Asia). Extreme longevity means severe PCB/PFAS bioaccumulation — contamination can close export markets even when populations are healthy. Sensitive to ocean acidification (larval shell formation) and deep-water DO",
  "Marbled murrelet": "Brachyramphus marmoratus — a federally threatened seabird that nests in old-growth forest canopy but feeds on marine forage fish (especially sand lance). The ultimate land-sea connector: forest cover determines nesting success, marine conditions determine feeding. At ~25% of historical, it integrates both terrestrial and marine health into a single population signal",
  "Humpback whale": "Megaptera novaeangliae — a dramatic recovery story (~7%/yr growth since 2010, ~500+ seasonally in the Salish Sea). Creates management tension with SRKW recovery: competes for herring/forage fish, benefits from the same vessel speed zones, and generates growing whale-watch tourism that competes with orca-watching economy. Vessel strikes are the #1 anthropogenic mortality source",
  "Sea otter": "Enhydra lutris — extirpated from Washington by the fur trade (~1910), reintroduction actively studied by WDFW. THE keystone predator: otters eat urchins, controlling the urchin-kelp regime shift. But they also eat Dungeness crab, geoduck, and shellfish, creating direct conflict with commercial and tribal fisheries. In the model, otters appear only when protectedAreaFraction exceeds 25%, representing an active reintroduction decision",
  "Jellyfish": "Aurelia, Chrysaora, and Cyanea spp. — bloom indicators of ecosystem degradation. Warm water + nutrient loading + overfishing = jellyfish replacing forage fish. They compete with larval fish for zooplankton and prey on fish eggs. NOT a species to conserve — an indicator that conditions favor gelatinous over fish-based food webs. Marine heat waves amplify blooms",
  "Lingcod": "Ophiodon elongatus — apex reef predator that completes the kelp forest food web (kelp → invertebrates → rockfish → lingcod). Recovers faster than rockfish (mature at 3-5yr vs 15-20yr), so MPA benefits appear earlier for lingcod. Popular recreational fishing species. Preys on rockfish, providing natural top-down population control",
  "Harbor porpoise": "Phocoena phocoena — the most common small cetacean in the Salish Sea (~10,000 individuals). Extremely noise-sensitive, among the first species to abandon areas with elevated vessel traffic. An acoustic canary: where porpoises are present, noise levels are acceptable for marine mammals. Bycatch in gillnets is a significant mortality source",
  "Pacific lamprey": "Entosphenus tridentatus — an ancient anadromous fish (450 million years old) that shares migration barriers with salmon but CANNOT use salmon-designed fish ladders (needs smooth ramps). No commercial value but deeply important to Indigenous food systems — smoked lamprey is a ceremony food. Larvae filter-feed in soft stream sediment, making them sensitive to sedimentation and water temperature",
  "Fish passage": "There are roughly 20,000 culvert and dam barriers in the Puget Sound watershed that block salmon and lamprey from reaching upstream spawning and rearing habitat. In US v. Washington (2018), the Supreme Court upheld a ruling requiring the state to replace culverts blocking salmon passage under state-owned roads — affirming treaty fishing rights depend on functional habitat. At 20% investment (current), most barriers remain. Full investment opens hundreds of miles of spawning and rearing habitat. Lamprey benefit at only ~60% the rate of salmon because standard fish ladders use stepped pools that lamprey cannot climb — they need smooth ramps or lamprey-specific passage structures",
  "Sediment oxygen demand": "Organic matter that sinks to the bottom accumulates over decades, continuously consuming dissolved oxygen as it slowly decomposes. This creates hysteresis: even after nutrient inputs are reduced, the decades of stored organic material keep consuming oxygen. Hood Canal is especially vulnerable due to its small volume and slow flushing",
  "Green infrastructure": "Rain gardens, bioswales, permeable pavement, and green roofs that absorb stormwater at the source. Reduces effective impervious surface, filters first-flush pollutants, and lowers CSO frequency. An alternative to expanding gray infrastructure (pipes and tunnels) with co-benefits for equity, urban cooling, and habitat",
  "Extreme event frequency": "Climate warming increases the probability and intensity of extreme events. Atmospheric rivers become 7% more frequent per °C of warming, wildfires increase with drought stress, and storms intensify with SST. Under high SSP pathways, compound events become the norm rather than the exception",
  "Burn scar": "After a wildfire, the soil becomes hydrophobic (water-repellent) for 2-5 years. This dramatically increases runoff and sediment delivery, even from normal rainfall. When an atmospheric river hits a burn scar, the result can be catastrophic debris flows that devastate downstream watersheds and marine habitats",
  "Groundwater": "Underground water stored in aquifers, recharged by precipitation infiltration. Provides summer baseflow to rivers and ~12% of municipal supply. Over-extraction lowers the water table, reduces baseflow, enables saltwater intrusion through the aquifer, and causes land subsidence that amplifies effective sea level rise in delta areas",
  "Seabirds": "Marbled murrelet, rhinoceros auklet, and pigeon guillemot — diving and surface foragers that depend on herring and forage fish, water clarity, and protected nesting habitat. Oil spills cause immediate mass mortality. A trophic indicator connecting the forage base to the broader ecosystem",
  "Pinnipeds": "Harbor seals and Steller sea lions, whose populations have grown ~5× since the Marine Mammal Protection Act of 1972. They concentrate at river mouths and consume juvenile and returning adult salmon. At current levels (~40,000-65,000), they exert 0-25% additional mortality on salmon. They also compete with Southern Resident orca for the same Chinook prey base. A politically charged management issue: whether predation is compensatory or additive determines whether culling helps salmon",
  "Vessel speed zones": "Mandatory speed reductions in Haro and Rosario Strait to protect orca. Reduces underwater noise by ~6dB (50% perceived) and ship strike risk by ~80%, but increases transit time and fuel costs 10-15%. Creates a quantifiable cost-per-orca-saved metric",
  "LNG transition": "Switching from heavy fuel oil to LNG or hydrogen: 25% less CO₂ (net of methane slip), 90% less SOx, near-zero particulate matter. Dramatically improves port-area air quality but requires massive infrastructure investment",
  "Environmental justice": "The fair distribution of environmental benefits and burdens across communities. In the Salish Sea region, near-industrial communities (Duwamish Valley) bear disproportionate pollution burden, while waterfront communities face higher flood exposure. Green infrastructure can help reduce these disparities",
  "Public health endpoints": "Quantifiable health outcomes that translate environmental conditions into costs: respiratory illness from air quality and wildfire, waterborne illness from sewage overflows, seafood contamination risk from PCBs/PFAS, and mental health impacts from flood displacement and noise",
  "Agricultural nutrient management": "Cover crops, buffer strips, and precision fertilizer that reduce nitrogen runoff from farmland by up to 60%. Directly reduces harmful algal bloom risk and shellfish closures in downstream marine waters",
  "Ballast water": "Ships take on seawater for stability and discharge it at destination, potentially introducing non-native species. Treatment systems remove 85% of invasive risk but add cost to shipping operations",
  "Submarine groundwater discharge": "Nutrients that enter the ocean through groundwater seeping from the seafloor, bypassing rivers and riparian buffers. Driven by septic systems and coastal development. A hidden loading source especially significant in enclosed embayments like Hood Canal",
  "Compensatory mortality": "When multiple predators eat the same prey, removing one predator may not help because remaining predators or other mortality sources fill the gap. Key policy insight: if salmon mortality is largely compensatory, culling pinnipeds won't increase salmon returns",
  "Whale watching": "Tourism vessels that specifically follow orca pods, creating localized acute noise distinct from ambient shipping. Reduces foraging efficiency 18-25% when boats are within 200m. Self-limiting feedback: orca decline reduces tourism appeal",
  "Cruise ships": "Large passenger vessels (3000+ passengers) visiting seasonally May-October. Generate tourism revenue and employment but also large wastewater volumes, air quality impacts, and acoustic disturbance during peak HAB and salmon migration season",
  "Property values": "Coastal property values respond to environmental amenity (orca sightings, clean water, air quality) and flood risk. Declining values reduce tax revenue that funds infrastructure maintenance — a self-reinforcing degradation spiral",
  "Housing density": "The choice between vertical growth (high density) and sprawl (low density). High density reduces per-capita environmental footprint but concentrates wastewater. Best outcome: high density + green infrastructure + transit",
  "Herring": "Pacific herring (Clupea pallasii) — small forage fish that spawn on eelgrass. A key food source connecting plankton to salmon and seabirds",
  "Treaty fisheries": "First Nations and tribal treaty rights to harvest salmon, shellfish, and herring. The 1974 Boldt Decision affirmed that tribes are entitled to 50% of the harvestable fish. Treaty fishery health in this model is multi-dimensional: ceremonial access, food security across four food sources, shellfish gathering rights, contamination burden, cultural keystone species health, and climate displacement risk",
  "Ceremonial access": "First Salmon ceremonies and potlatch protocols require specific chinook stocks at specific seasonal timing. Climate warming shifts run peaks earlier (~2 days/°C), disrupting the generational knowledge of when and where to harvest. Wild fish fulfill ceremonial obligations that hatchery fish cannot",
  "Indigenous food sovereignty": "The ability of Coast Salish communities to feed themselves from their traditional waters — salmon, shellfish, herring, and Dungeness crab. Each food source has different vulnerability pathways. When the weakest link fails, food sovereignty is compromised even if other sources remain healthy",
  "Contamination advisory": "When PCBs, PFAS, or other contaminants accumulate in fish and shellfish, health advisories restrict consumption. This forces Indigenous communities into an impossible choice between cultural practice (eating traditional foods) and health (avoiding contaminants). The contamination originates from industrial activities but the burden falls on communities whose food systems depend on these waters",
  "Cultural keystone species": "In Coast Salish worldview, orca (qwe'lhol'mechen) are relatives, not just wildlife. Salmon are a gift that returns. Cedar is the tree of life. Eelgrass and kelp are the foundation of marine habitat. These are not separate resources but parts of an interconnected cultural-ecological system. Orca decline is experienced as family loss",
  "Climate displacement": "Warming shifts species ranges northward, shifts salmon run timing earlier, and sea level rise inundates usual and accustomed fishing areas. This erodes place-based traditional ecological knowledge developed over millennia. Co-management enables adaptive strategies but cannot replace the loss of place-based relationships",
  "Co-management": "The system of shared governance between tribal nations and state/federal agencies, rooted in the 1974 Boldt Decision. Effective co-management integrates traditional ecological knowledge (TEK) with Western science, improving habitat restoration, adaptive harvest management, and climate resilience. Higher co-management index represents stronger tribal voice in decision-making",
  "Atmospheric river": "A long, narrow band of moisture from the tropics that delivers days of heavy rain, causing flooding and massive runoff",
  "Tsunami": "A large ocean wave triggered by an earthquake or submarine landslide. Can flood low-lying port areas within minutes of a Cascadia quake",
  "Fraser freshet": "The massive spring snowmelt pulse from glaciers feeding the Fraser River, peaking in June. Delivers ~50% of all freshwater to the Salish Sea. Weakens as snowpack and glacial mass decline under warming",
  "Peak water": "A transitional phase where glacial melt temporarily increases river flow as glaciers retreat faster, before flow permanently collapses when the glacier is gone. Most Cascade/Coast Range glaciers projected to be gone by 2060-2080 under SSP5-8.5",
  "Snowpack": "Seasonal snow accumulation in mountains measured in mm of snow water equivalent (SWE). As warming shifts precipitation from snow to rain, spring snowmelt freshets weaken and summer water supplies decline",
  "Delta subsidence": "River deltas slowly sink under the weight of accumulated sediment, making sea level rise effectively faster in places like the Fraser Delta",
  "Supply chain": "The network of ships, ports, trucks, and trains that move goods around the world. The Salish Sea is a key hub with only two ocean exits",
  "Tourism": "Orca watching, recreation, and cruise ships — a major economic driver that depends on healthy ecosystems and clean water",
  "Military presence": "Naval bases at Bangor, Bremerton, and Whidbey Island (US) plus Esquimalt (Canada) — provide stable jobs and security but add underwater noise",
  "Cross-border coordination": "How well the US and Canada work together to manage shared water quality, fisheries, disaster response, and trade across the Salish Sea",
  "Autonomous vessels": "Self-driving cargo ships that reduce crew costs but may increase vessel density. Expected within a decade",
  "Urban Sea System": "A concept from Greene & Delaney (2025): the interconnected network of ports, marine waters, and entire watersheds that together form a system of systems",
  "Characterization rubric": "Seven elements from Greene & Delaney (2025) for comparing Urban Sea Systems: physiography, size, age, population, economy, ecology, and significance",
  "HAB": "Harmful Algal Bloom — toxic algae (Alexandrium, Pseudo-nitzschia) that thrive in warm, nutrient-rich, stratified water. Can close shellfish fisheries worth hundreds of millions",
  "Shellfish closure": "When HAB toxins make shellfish unsafe to eat, fisheries are closed. Affects tribal, commercial, and recreational harvest",
  "Pinnipeds": "Harbor seals and sea lions — their populations have grown ~5× since the 1972 Marine Mammal Protection Act. They eat salmon at river mouths, competing with orca",
  "Hatchery fish": "Salmon raised in hatcheries then released. They boost total numbers but can reduce wild salmon fitness through genetic mixing and competition for spawning habitat",
  "Wild salmon": "Salmon that spawn and rear naturally in rivers. Their genetic diversity is essential for long-term population resilience",
  "PFAS": "Per- and polyfluoroalkyl substances — 'forever chemicals' from firefighting foam, nonstick coatings, and industrial use. They don't break down and accumulate in food webs",
  "PCBs": "Polychlorinated biphenyls — banned in 1979 but persist in sediments for decades. SRKW orca are among the most PCB-contaminated marine mammals in the world",
  "Microplastics": "Tiny plastic particles from clothing fibers, tire wear, and degraded debris. Increasing steadily in all Salish Sea basins",
  "SSP pathway": "Shared Socioeconomic Pathway — climate scenarios ranging from SSP1-2.6 (strong mitigation, ~1°C warming) to SSP5-8.5 (high emissions, ~3°C warming by 2100)",
  "Ship strike": "Collision between a vessel and a whale. Risk increases with vessel traffic and speed. Vessel slowdown zones reduce risk for orca",
  "Vessel foraging loss": "Chronic reduction in orca foraging efficiency caused by vessel noise (Williams et al. 2006). Vessels disrupt echolocation-based hunting, reducing successful prey capture by 18-25%. Unlike acute noise events, this is a persistent baseline cost whenever vessel traffic is present. Orca protection zones reduce but don't eliminate the effect. Under green transition scenarios, reduced vessel noise restores foraging efficiency and enables population recovery",
  "Inbreeding depression": "Reduced fitness from mating among relatives in small populations. SRKW effective population size (Ne) is only ~25-35, among the lowest of any mammal (Lacy et al. 2017). Causes immune compromise, reduced disease resistance, and developmental abnormalities. A fixed mortality cost (~0.2%/qtr) that cannot be mitigated by prey or habitat improvement — only population growth reduces its per-capita impact",
  "Ocean acidification": "Absorption of atmospheric CO₂ makes seawater more acidic, threatening shellfish, corals, and organisms that build calcium carbonate shells",
  "Data nudging": "A data assimilation technique (Newtonian relaxation) where model variables are gently pulled toward observed values each timestep. Alpha=0.10 means 10% correction per quarter — strong enough to correct drift but gentle enough to preserve model dynamics. Import real observations from NOAA, Ecology, or NANOOS via the Research panel to activate nudging",
  "CF convention": "Climate and Forecast metadata conventions — a standard for naming ocean variables (e.g. sea_surface_temperature, mass_concentration_of_oxygen_in_sea_water). Used by the EU Digital Twin Ocean, Copernicus, and NOAA to ensure interoperability between different ocean models and data products",
  "J Pod": "The most inland-ranging of the three Southern Resident pods (24 members, July 2025). Frequently seen in the San Juan Islands",
  "K Pod": "The smallest and most endangered pod (14 members, July 2025). Highest PCB contamination load — greatest extinction risk",
  "L Pod": "The largest pod (36 members, July 2025). Ranges most widely, spending significant time on the outer coast",
  "Extinction risk": "The probability a population will drop below viable numbers. Allee effects accelerate decline below ~15 individuals",
  "NPZD": "Nutrient-Phytoplankton-Zooplankton-Detritus — a biogeochemical model tracking nitrogen flow through the marine food web",
  "Detritus": "Dead organic matter that sinks and decomposes, consuming oxygen and recycling nutrients back into the water column",
  "Genetic diversity": "Variety of genes within a salmon population. Hatchery fish reduce wild genetic diversity through interbreeding",
  "Markov chain": "A model where the next state depends only on the current state. Used here for stochastic ENSO transitions",
  "Aragonite saturation": "Ω_aragonite measures whether seawater can support shell formation. Above 1.0, calcium carbonate shells grow; below 1.0, they dissolve. The PNW shellfish industry ($100M+) depends on Ω staying above 1.0. Declining pH from ocean acidification pushes Ω lower",
  "Tidal energy tradeoff": "Extracting energy from tidal currents in narrow straits (Admiralty Inlet, San Juan Channel) provides clean power but reduces the mixing that ventilates deep basins. Hood Canal is most vulnerable — less mixing means worse hypoxia. The CO₂ benefit takes decades to materialize while the mixing cost is immediate",
  "Infrastructure decay spiral": "A self-reinforcing feedback loop: coastal flooding and pollution lower property values, reducing tax revenue for infrastructure maintenance. Aging infrastructure increases CSO frequency and flood risk, further depressing property values. Decay accumulates 3× faster than recovery — prevention is far cheaper than repair",
  "Property value index": "Composite index reflecting how environmental quality affects coastal real estate: flood risk, water quality, air quality, and ecosystem amenity (orca viewing, beach access). Drives tax revenue that funds infrastructure maintenance",
};

// Tooltip component (module-scope — avoids re-creation each render)
var Tip = function(props) {
  var glossDef = GLOSSARY[props.text] || props.text;
  return (
    <span title={glossDef} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 14, height: 14, borderRadius: 7, fontSize: 8, fontWeight: 500, color: "var(--color-text-tertiary)", border: "1px solid var(--color-border-tertiary)", cursor: "help", marginLeft: 3, flexShrink: 0 }}>?</span>
  );
};

// Glossary-aware label: if studentMode, append tooltip (module-scope)
var GL = function(props) {
  if (!props.studentMode) return props.children;
  var def = GLOSSARY[props.term || props.children];
  if (!def) return props.children;
  return (
    <span>{props.children}<span title={def} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 13, height: 13, borderRadius: 7, fontSize: 7, color: "var(--color-text-tertiary)", border: "1px solid var(--color-border-tertiary)", cursor: "help", marginLeft: 3, verticalAlign: "middle" }}>?</span></span>
  );
};

function generateCascadeMsg(prev, curr) {
  if (!prev || !curr) return null;
  var msgs = [];
  var pm = prev.marine.state, cm = curr.marine.state;
  var pe = prev.ecosystem.state, ce = curr.ecosystem.state;
  var pu = prev.urban.state, cu = curr.urban.state;
  var dDO = cm.dissolvedOxygen - pm.dissolvedOxygen;
  var dOrca = (ce.orcaPopulation||74) - (pe.orcaPopulation||74);
  var dSalmon = ce.salmonRunStrength - pe.salmonRunStrength;
  var dEquity = (cu.equityIndex||0.65) - (pu.equityIndex||0.65);
  var dWQ = cm.waterQualityIndex - pm.waterQualityIndex;
  var dCSO = cu.csoFrequency - pu.csoFrequency;
  if (Math.abs(dDO) > 0.5) msgs.push((dDO < 0 ? "Oxygen dropped" : "Oxygen improved") + " by " + Math.abs(dDO).toFixed(1) + " mg/L");
  if (Math.abs(dSalmon) > 5) msgs.push((dSalmon < 0 ? "Salmon runs declined" : "Salmon runs improved") + " by " + Math.abs(dSalmon).toFixed(0) + " points");
  if (Math.abs(dOrca) > 0.5) msgs.push("Orca population " + (dOrca < 0 ? "fell" : "grew") + " by " + Math.abs(dOrca).toFixed(0));
  if (Math.abs(dEquity) > 0.03) msgs.push("Social equity " + (dEquity < 0 ? "worsened" : "improved") + " by " + Math.abs(dEquity*100).toFixed(0) + "%");
  if (Math.abs(dWQ) > 0.05) msgs.push("Water quality " + (dWQ < 0 ? "declined" : "improved") + " " + Math.abs(dWQ*100).toFixed(0) + "%");
  if (Math.abs(dCSO) > 1) msgs.push("Sewage overflows " + (dCSO > 0 ? "increased" : "decreased") + " by " + Math.abs(dCSO).toFixed(1) + "/month");
  // Marine heat wave onset/end
  var prevMHW = prev.mhw ? prev.mhw.active : 0;
  var currMHW = curr.mhw ? curr.mhw.active : 0;
  if (currMHW && !prevMHW) msgs.push("🌡 Marine heat wave began — SST +" + (curr.mhw.sstAnomaly||0).toFixed(1) + "°C anomaly, expect kelp/salmon/HAB cascades");
  if (!currMHW && prevMHW) msgs.push("Marine heat wave ended — ecosystem recovery begins (slow)");
  // Eelgrass hysteresis — regime shift detection
  var prevEstab = pe.eelgrassEstablishment !== undefined ? pe.eelgrassEstablishment : 0.7;
  var currEstab = ce.eelgrassEstablishment !== undefined ? ce.eelgrassEstablishment : 0.7;
  if (prevEstab >= 0.3 && currEstab < 0.3) msgs.push("⚠ EELGRASS REGIME SHIFT — establishment below 0.3, seedbank depleted. Recovery now functionally impossible on management timescales");
  else if (currEstab < 0.4 && prevEstab >= 0.4) msgs.push("Eelgrass declining toward regime shift threshold (0.3) — herring spawning habitat at risk");
  var dEelgrass = currEstab - prevEstab;
  if (Math.abs(dEelgrass) > 0.03) msgs.push("Eelgrass establishment " + (dEelgrass < 0 ? "declined" : "recovered") + " by " + Math.abs(dEelgrass * 100).toFixed(0) + "%" + (currEstab < 0.3 ? " — REGIME SHIFT active" : ""));
  // Eelgrass restoration milestones
  if (dEelgrass > 0.02 && currEstab > 0.5 && prevEstab <= 0.5) msgs.push("🌿 Eelgrass restoration milestone — establishment above 50%, herring spawning habitat recovering");
  if (dEelgrass > 0.02 && currEstab > 0.7 && prevEstab <= 0.7) msgs.push("🌿 Eelgrass meadows healthy — establishment above 70%, cascading benefits for crab, salmon, and coastal protection");
  // Green crab invasion detection
  var prevGC = pe.greenCrabPop || 0;
  var currGC = ce.greenCrabPop || 0;
  if (currGC > 0.3 && prevGC <= 0.3) msgs.push("🦀 Green crab population explosion — density above 30%, eelgrass destruction accelerating");
  if (currGC > 0.6 && prevGC <= 0.6) msgs.push("🦀 Green crab invasion severe — density above 60%, native shellfish and eelgrass heavily impacted");
  if (currGC < 0.1 && prevGC >= 0.1) msgs.push("Green crab population suppressed below 10% — removal efforts succeeding");
  // Snowpack and glacial retreat
  var prevGlacial = (prev.watershed && prev.watershed.state) ? prev.watershed.state.glacialMass : 1.0;
  var currGlacial = (curr.watershed && curr.watershed.state) ? curr.watershed.state.glacialMass : 1.0;
  if (prevGlacial !== undefined && currGlacial !== undefined) {
    if (prevGlacial >= 0.5 && currGlacial < 0.5) msgs.push("⛰ Glacial mass below 50% of 2026 baseline — summer baseflow decline accelerating, peak water approaching");
    if (prevGlacial >= 0.2 && currGlacial < 0.2) msgs.push("⛰ Glacial retreat critical — only 20% mass remaining, summer water supply collapse imminent");
    if (prevGlacial > 0.05 && currGlacial <= 0.05) msgs.push("⛰ GLACIERS EFFECTIVELY GONE — summer baseflow permanently reduced, Fraser River discharge halved");
  }
  var prevSnow = (prev.watershed && prev.watershed.state) ? prev.watershed.state.snowpack : 180;
  var currSnow = (curr.watershed && curr.watershed.state) ? curr.watershed.state.snowpack : 180;
  if (prevSnow !== undefined && currSnow !== undefined && prevSnow > 50 && currSnow < 50) msgs.push("Snowpack critically low (<50 mm SWE) — freshet will be weak, summer drought stress elevated");
  // Burn scar detection
  var prevBurnSc = (prev.watershed && prev.watershed.state) ? prev.watershed.state.activeBurnScar || 0 : 0;
  var currBurnSc = (curr.watershed && curr.watershed.state) ? curr.watershed.state.activeBurnScar || 0 : 0;
  if (currBurnSc > 0.3 && prevBurnSc <= 0.3) msgs.push("🔥 Burn scar active — hydrophobic soil amplifying runoff ×" + (1 + currBurnSc * 1.5).toFixed(1) + " and sediment ×" + (1 + currBurnSc * 3).toFixed(1) + ". Watch for debris flows if atmospheric river hits");
  var currDebris = (curr.watershed && curr.watershed.state) ? curr.watershed.state.debrisFlowRisk || 0 : 0;
  if (currDebris > 0.5) msgs.push("⚠ DEBRIS FLOW — atmospheric river hitting active burn scar! Catastrophic sediment pulse into marine system");
  // Groundwater depletion
  var prevGW2 = (prev.watershed && prev.watershed.state) ? prev.watershed.state.groundwaterLevel : 0.7;
  var currGW2 = (curr.watershed && curr.watershed.state) ? curr.watershed.state.groundwaterLevel : 0.7;
  if (prevGW2 !== undefined && currGW2 !== undefined) {
    if (prevGW2 >= 0.3 && currGW2 < 0.3) msgs.push("💧 Groundwater critically low — aquifer below 30%, saltwater intrusion accelerating, summer baseflows collapsing");
    if (prevGW2 >= 0.5 && currGW2 < 0.5) msgs.push("Groundwater declining below 50% — subsidence risk increasing in delta areas");
  }
  // Aragonite saturation thresholds
  var prevOmega = (prev.marine && prev.marine.state) ? prev.marine.state.minOmegaAragonite : 2.0;
  var currOmega = (curr.marine && curr.marine.state) ? curr.marine.state.minOmegaAragonite : 2.0;
  if (prevOmega !== undefined && currOmega !== undefined) {
    if (prevOmega >= 1.0 && currOmega < 1.0) msgs.push("⚗ ARAGONITE UNDERSATURATION — Ω < 1.0 in at least one basin. Shell dissolution threshold crossed. Shellfish larval mortality imminent");
    if (prevOmega >= 1.5 && currOmega < 1.5) msgs.push("⚗ Aragonite saturation declining below 1.5 — shellfish stress zone, oyster/mussel larvae at risk");
  }
  // Tidal energy tradeoff detection
  var prevTidal = (prev.marine && prev.marine.state) ? prev.marine.state.tidalExtraction || 0 : 0;
  var currTidal = (curr.marine && curr.marine.state) ? curr.marine.state.tidalExtraction || 0 : 0;
  if (currTidal > 0.3 && prevTidal <= 0.3) msgs.push("🌊 Tidal energy extraction significant (>" + (currTidal*100).toFixed(0) + " MW) — monitor Hood Canal DO for mixing reduction impacts");
  if (currTidal > 0.6 && prevTidal <= 0.6) msgs.push("🌊 Tidal energy extraction high — stratification increasing, Hood Canal hypoxia risk elevated. Tradeoff: CO₂ benefit is decades away");
  // Dungeness crab population
  var prevDCrab = pe.dungenessCrabPop !== undefined ? pe.dungenessCrabPop : 0.65;
  var currDCrab = ce.dungenessCrabPop !== undefined ? ce.dungenessCrabPop : 0.65;
  if (prevDCrab >= 0.3 && currDCrab < 0.3) msgs.push("🦀 Dungeness crab below minimum stock threshold — fishery closure likely, $250M/yr industry at risk");
  if (currDCrab < 0.2 && prevDCrab >= 0.2) msgs.push("🦀 Dungeness crab population critical — hypoxia, acidification, and green crab predation compounding");
  // Orca population thresholds and pod extinction
  var prevOrcaPop2 = (prev.ecosystem && prev.ecosystem.state) ? prev.ecosystem.state.orcaPopulation || 74 : 74;

function historyToCSV(history, params, activePolicies, eventLog) {

// RESILIENCE / PREPAREDNESS INDEX
// ═══════════════════════════════════════════════════════════
function computePreparedness(results, params, activePolicies) {
  var us = results.urban.state, ps = results.port.state, ws = results.watershed.state;
  var iaf = params.urban.stormwaterInfraAge / 100;
  var govCoord = (params.urban.crossBorderCoord || 50) / 100;
  var hasPolicies = Object.keys(activePolicies);

  // Infrastructure readiness (newer = better prepared)
  var infraReady = cl(1 - iaf, 0, 1) * 0.25;
  // Stormwater/flood capacity
  var floodPrep = cl((1 - (us.coastalFloodRisk !== undefined ? us.coastalFloodRisk : 0)) * 0.5 + (params.urban.wastewaterEfficiency || 75) / 100 * 0.5, 0, 1) * 0.2;
  // Supply chain redundancy
  var supplyPrep = cl((ps.supplyChainEff !== undefined ? ps.supplyChainEff : 1) * 0.5 + (hasPolicies.indexOf("supplyResilience") >= 0 ? 0.3 : 0), 0, 1) * 0.15;
  // Cross-border disaster response coordination
  var govPrep = govCoord * 0.15;
  // Ecological buffer (healthy ecosystems absorb shocks better)
  var ecoBuffer = cl(results.ecosystem.state.biodiversityIndex * 0.5 + ws.effForest / 100 * 0.5, 0, 1) * 0.15;
  // Financial reserves proxy (low current spending = more capacity to respond)
  var totalCost = Object.keys(activePolicies).reduce(function(s, k) { return s + (POL[k]?.cost || 0); }, 0);
  var fiscalCapacity = cl(1 - totalCost / 5000, 0, 1) * 0.1;

  var total = cl(infraReady + floodPrep + supplyPrep + govPrep + ecoBuffer + fiscalCapacity, 0, 1);

  // Projected impact of a Cascadia M9 at current readiness
  var eqDamage = cl(0.7 * (1 - govCoord * 0.2) * (1 + iaf * 0.5), 0.2, 1);
  var recoveryYears = cl(2 + (1 - total) * 6, 1, 10);

  return {
    total: total,
    infraReady: infraReady / 0.25,
    floodPrep: floodPrep / 0.2,
    supplyPrep: supplyPrep / 0.15,
    govPrep: govPrep / 0.15,
    ecoBuffer: ecoBuffer / 0.15,
    fiscalCapacity: fiscalCapacity / 0.1,
    eqProjectedDamage: eqDamage,
    eqRecoveryYears: recoveryYears,
    label: total > 0.7 ? "Well prepared" : total > 0.4 ? "Partially prepared" : "Vulnerable"
  };
}

// Estimate what a policy would change if activated now
function estimatePolicyImpact(polKey, results, params) {
  var pol = POL[polKey];
  if (!pol) return null;
  var impacts = [];
  Object.entries(pol.fx).forEach(function(modEntry) {
    var mod = modEntry[0], changes = modEntry[1];
    Object.entries(changes).forEach(function(paramEntry) {
      var pk = paramEntry[0], dv = paramEntry[1];
      var meta = PM[mod] && PM[mod].p[pk];
      var label = meta ? meta.l : pk;
      var unit = meta ? meta.u : "";
      var current = params[mod] ? params[mod][pk] : 0;
      var projected = cl(current + dv, meta ? meta.mn : 0, meta ? meta.mx : 100);
      impacts.push({ label: label, current: current, projected: projected, delta: dv, unit: unit });
    });
  });
  return impacts;
}

// ═══════════════════════════════════════════════════════════
// URBAN SEA SYSTEM CHARACTERIZATION (Greene & Delaney, 2025)
// ═══════════════════════════════════════════════════════════
// 7-element rubric from: Estuarine, Coastal and Shelf Science 322 (2025) 109274
// Elements: Physiography, Size, Age, Population, Impacts, Economy+Self-Sufficiency, Ecology, Significance
function computeUrbSeaScore(results, year, params) {
  var ms = results.marine.state, es = results.ecosystem.state;
  var us = results.urban.state, ps = results.port.state, ws = results.watershed.state;
  var yrs = year - 2026;

  // 1. Physiography/Geotectonic + Climate: Fixed for Salish Sea
  var physiography = { label: "Temperate Active Margin", rating: "Active convergent (Cascadia Subduction Zone)", fixed: true };

  // 2. Size: Fixed macro-system (paper: Macro = 10,000–10,000,000 km²)
  var size = { label: "Macro", rating: "~560,000 km² combined land+sea", areaKm2: 560000, fixed: true };

  // 3. Age: Young per paper Section 7.1 (industrialized ~150 years)
  var age = { label: "Young", rating: "Industrialized ~" + (150 + yrs) + " years (since ~1880)", fixed: true };

  // 4. Population: Dynamic — thresholds from Appendix A
  // Paper: Small <1M, Medium 1–10M, Large 10–30M, Very Large >30M
  var pop = (us.dynamicPopulation !== undefined ? us.dynamicPopulation : 4200000) / 1e6;
  var popLabel = pop > 30 ? "Very Large" : pop > 10 ? "Large" : pop > 1 ? "Medium" : "Small";
  var population = { label: popLabel, rating: pop.toFixed(1) + "M people", value: pop, dynamic: true };

  // 5. Natural vs. Anthropogenic Impacts (paper Section 5.5)
  // Paper rates Salish as "Moderate to High Adverse Impact"
  // Natural: earthquake/tsunami/volcanic risk (fixed high for active margin) + storm/atmospheric river
  // Anthropogenic: climate change (SST drift, SLR), contamination, urbanization, noise
  var naturalHazardBase = 0.35; // fixed: active subduction zone = moderate-high baseline
  var climateImpact = cl((ms.sst - 10) / 6 * 0.3 + (us.coastalFloodRisk !== undefined ? us.coastalFloodRisk : 0) * 0.3 + (us.waterStress || 0) * 0.2, 0, 0.5);
  var anthropoImpact = cl(ms.contaminationLevel * 0.25 + ms.noiseIndex * 0.15 + (1 - (ws.airQuality !== undefined ? ws.airQuality : 0.85)) * 0.15
    + cl((pop - 4.2) / 8, 0, 0.2) * 0.15 + (ws.popDrivenImpervious || 0) / 25 * 0.15, 0, 0.5);
  var activeDisasters = 0;
  if (results.watershed && results.watershed.state) {
    activeDisasters = cl((ws.submarineLandslide || 0) * 0.3 + (ws.droughtStress || 0) * 0.1, 0, 0.15);
  }
  var impactScore = cl(naturalHazardBase + climateImpact + anthropoImpact + activeDisasters, 0, 1);
  // Paper scale: Light, Moderate, Heavy, Severe
  var impactLabel = impactScore > 0.7 ? "Severe" : impactScore > 0.5 ? "Heavy" : impactScore > 0.3 ? "Moderate–High" : "Light–Moderate";
  var impacts = { label: impactLabel, rating: (impactScore * 100).toFixed(0) + "% exposure", value: impactScore, dynamic: true };

  // 6. Economic Vitality + Self-Sufficiency (paper Section 5.6)
  // Paper: Dynamic / Stable / Declining + Strong / Moderate / Weak
  var econScore = cl(ps.opCap * 0.3 + cl(ps.employment / 60000, 0, 1) * 0.3 + (ps.supplyChainEff !== undefined ? ps.supplyChainEff : 1) * 0.2 + cl(ps.revenue / 5000, 0, 1) * 0.2, 0, 1);
  var selfSuff = cl((params.urban.energyCleanFraction || 45) / 100 * 0.3 + cl(ws.freshwaterDischarge / 6000, 0, 1) * 0.3 + (ps.supplyChainEff !== undefined ? ps.supplyChainEff : 1) * 0.2 + (1 - (us.waterStress || 0)) * 0.2, 0, 1);
  var econLabel = econScore > 0.7 ? "Dynamic" : econScore > 0.4 ? "Stable" : "Declining";
  var suffLabel = selfSuff > 0.7 ? "Strong" : selfSuff > 0.4 ? "Moderate" : "Weak";
  var economy = { label: econLabel, rating: (econScore * 100).toFixed(0) + "% vitality", value: econScore, selfSufficiency: suffLabel, selfSuffValue: selfSuff, dynamic: true };

  // 7. Ecological Status (paper Section 5.6.1–5.6.3)
  // Paper: Nearly Pristine / Partially Degraded / Degraded / Severely Degraded
  var ecoScore = cl(ms.waterQualityIndex * 0.25 + es.biodiversityIndex * 0.25 + es.kelpHealth * 0.15 + (1 - es.totalStress) * 0.15 + (es.herringPop !== undefined ? es.herringPop : 0.5) * 0.1 + (es.treatyFisheryHealth !== undefined ? es.treatyFisheryHealth : 0.5) * 0.1, 0, 1);
  var ecoLabel = ecoScore > 0.7 ? "Nearly Pristine" : ecoScore > 0.5 ? "Nearly Pristine–Degraded" : ecoScore > 0.3 ? "Degraded" : "Severely Degraded";
  var ecology = { label: ecoLabel, rating: (ecoScore * 100).toFixed(0) + "% health", value: ecoScore, dynamic: true };

  // Significance: capstone assessment (paper Section 5.7)
  // Paper: High / Moderate / Poor
  var sigScore = cl(econScore * 0.25 + ecoScore * 0.2 + cl(pop / 10, 0, 1) * 0.15 + (us.equityIndex !== undefined ? us.equityIndex : 0.65) * 0.15 + selfSuff * 0.15 + (1 - impactScore * 0.5) * 0.1, 0, 1);
  var sigLabel = sigScore > 0.6 ? "High" : sigScore > 0.35 ? "Moderate" : "Poor";
  var significance = { label: sigLabel, rating: (sigScore * 100).toFixed(0) + "% composite", value: sigScore, dynamic: true };

  return {
    physiography: physiography, size: size, age: age,
    population: population, impacts: impacts,
    economy: economy, ecology: ecology, significance: significance,
    composite: cl((econScore + ecoScore + sigScore + selfSuff + (us.equityIndex !== undefined ? us.equityIndex : 0.65) + (1 - impactScore)) / 6, 0, 1),
    summary: "Young, Temperate Active Margin Macro-Urban Sea System — " + popLabel + " Population, " + impactLabel + " Impacts, " + econLabel + " Economy, " + suffLabel + " Self-Sufficiency, " + ecoLabel + " Ecological Status, " + sigLabel + " Significance"
  };
}

var MODEL_DOC = [

// ERROR BOUNDARY — prevents white screen on NaN propagation or undefined access

class SimErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error: error }; }
  componentDidCatch(error, info) { console.error("Salish Twin render error:", error, info.componentStack); }
  render() {
    if (this.state.hasError) {
      var self = this;
      return React.createElement("div", { style: { padding: 40, textAlign: "center", fontFamily: "var(--font-sans)" } },
        React.createElement("div", { style: { fontSize: 18, fontWeight: 500, marginBottom: 12 } }, "Simulation produced invalid results"),
        React.createElement("div", { style: { fontSize: 13, color: "var(--color-text-secondary)", marginBottom: 16 } },
          "This usually happens with extreme parameter combinations. Error: " + String(this.state.error && this.state.error.message || "Unknown")),
        React.createElement("button", {
          onClick: function() { self.setState({ hasError: false, error: null }); },
          style: { padding: "8px 20px", fontSize: 13, borderRadius: 6, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", cursor: "pointer" }
        }, "Reset and try again")
      );
    }
    return this.props.children;
  }
}
