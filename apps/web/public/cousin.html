          ).map(function(entry) {
            var tabName = entry[0], tabLabel = entry[1];
            var isActive = tab === tabName;
            return (
            <button key={tabName} onClick={() => setTab(tabName)} style={{
              padding: studentMode ? "6px 14px" : "5px 12px", fontSize: studentMode ? 12 : 11, borderRadius: 6, border: "none", cursor: "pointer", transition: "all 0.15s",
              background: isActive ? "var(--color-background-primary)" : "transparent",
              color: isActive ? "var(--color-text-primary)" : "var(--color-text-tertiary)",
              fontWeight: isActive ? 600 : 400,
              boxShadow: isActive ? "0 1px 4px rgba(0,0,0,0.08)" : "none",
            }}>
              {tabLabel}
            </button>
          );
          })}
        </div>
      </div>

      {/* Active shock indicators */}
      {anyShockActive && (
        <div style={{ display: "flex", gap: 5, marginBottom: 10, flexWrap: "wrap" }}>
          {Object.entries(shocks).filter(([, v]) => v > 0.05).map(([dtype, intensity]) => {
            var studentNames = { earthquake: "Earthquake shaking!", tsunami: "Tsunami flooding!", oilSpill: "Oil spreading!", storm: "Storm raging!", atmosphericRiver: "Heavy rain flooding!", volcano: "Volcano erupting!", wildfire: "Fires burning!" };
            return (
            <div key={dtype} style={{
              padding: "6px 12px", borderRadius: 8, fontSize: 11, fontWeight: 500,
              background: DIS[dtype].c + "10", color: DIS[dtype].c,
              border: "1px solid " + DIS[dtype].c + "30",
              display: "flex", alignItems: "center", gap: 6,
            }}><span style={{ fontSize: 14 }}>{DIS[dtype].ic}</span> {studentMode ? studentNames[dtype] : DIS[dtype].l} — <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>{(intensity * 100).toFixed(0)}%</span></div>
          );
          })}
        </div>
      )}

      {/* KPI cards — student mode shows emoji + plain language */}
      {studentMode ? (
        <div>
          {/* ── WELCOME PANEL (shown before first play) ── */}
          {showWelcome && !playing && history.length === 0 && (
            <div style={{ padding: 16, borderRadius: 12, marginBottom: 12, background: "linear-gradient(135deg, #E6F1FB, #E1F5EE)", border: "1px solid #b8d4e8" }}>
              <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 6 }}>Welcome, explorer! 👋</div>
              <div style={{ fontSize: 13, color: "#444", lineHeight: 1.5, marginBottom: 10 }}>
                You're looking at a living model of the <strong>Salish Sea</strong> — the ocean waters around Seattle, Vancouver, and the San Juan Islands. Everything here is connected: forests filter rainwater, rivers carry nutrients to the ocean, plankton feed fish, fish feed salmon, and salmon feed orcas.
              </div>
              <div style={{ fontSize: 13, color: "#444", lineHeight: 1.5, marginBottom: 12 }}>
                Press <strong>▶ Play</strong> to start time moving forward, then try triggering a disaster or turning on a policy to see what happens. Every choice you make ripples through the whole system.
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <button onClick={function() { setPlaying(true); lastTickTime.current = 0; setShowWelcome(false); }} style={{ padding: "8px 24px", fontSize: 14, fontWeight: 600, borderRadius: 8, border: "none", cursor: "pointer", background: "#378ADD", color: "white" }}>▶ Start exploring</button>
                <button onClick={function() { setShowWelcome(false); }} style={{ padding: "8px 16px", fontSize: 12, borderRadius: 6, border: "1px solid #b8d4e8", cursor: "pointer", background: "white", color: "#555" }}>Skip intro</button>
              </div>
            </div>
          )}

          {/* ── STUDENT KPI CARDS ── */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8, marginBottom: 12 }}>
            {[
              { label: "Ocean health", value: mState.waterQualityIndex, emoji: function(v) { return v > 0.7 ? "🌊" : v > 0.4 ? "🌊" : "🏭"; } },
              { label: "Wildlife", value: eState.biodiversityIndex, emoji: function(v) { return v > 0.7 ? "🦀" : v > 0.4 ? "🐟" : "💀"; } },
              { label: "Orcas", value: eState.orcaViability, emoji: function(v) { return v > 0.7 ? "🐋" : v > 0.4 ? "🐋" : "😢"; } },
              { label: "Fairness", value: uState.equityIndex !== undefined ? uState.equityIndex : 0.65, emoji: function(v) { return v > 0.7 ? "⚖️" : v > 0.4 ? "⚖️" : "❌"; } },
              { label: "Jobs", value: clamp(pState.employment / 40000, 0, 1), emoji: function(v) { return v > 0.7 ? "💼" : v > 0.4 ? "💼" : "📉"; } },
            ].map(function(kpi) {
              var col = healthColor(kpi.value);
              var statusWord = kpi.value > 0.7 ? "Good" : kpi.value > 0.4 ? "Okay" : "Trouble!";
              return (
                <div key={kpi.label} style={{ padding: "12px 8px", borderRadius: 12, border: "2px solid " + col + "40", textAlign: "center", background: col + "08", transition: "all 0.5s" }}>
                  <div style={{ fontSize: 28, lineHeight: 1 }}>{kpi.emoji(kpi.value)}</div>
                  <div style={{ fontSize: 22, fontWeight: 600, fontFamily: "var(--font-mono)", color: col, marginTop: 4 }}>{(kpi.value * 100).toFixed(0)}</div>
                  <div style={{ fontSize: 11.5, color: "var(--color-text-secondary)", marginTop: 2, fontWeight: 500 }}>{kpi.label}</div>
                  <div style={{ fontSize: 10, marginTop: 2, color: col, fontWeight: 500 }}>{emojiStatus(kpi.value)} {statusWord}</div>
                </div>
              );
            })}
          </div>

          {/* ── ACTIVE CHALLENGE ── */}
          {activeChallenge && challengeScore && (
            <div style={{ padding: 14, borderRadius: 12, marginBottom: 10, border: challengeMet ? "2px solid #2d7a4f" : "2px solid var(--color-border-tertiary)", background: challengeMet ? "#2d7a4f12" : "var(--color-background-secondary)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <span style={{ fontSize: 24 }}>{challengeMet ? "🎉" : challengeScore.icon}</span>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{challengeMet ? "Challenge complete!" : challengeScore.title}</div>
                  <div style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>{challengeScore.desc}</div>
                </div>
                <button onClick={function() { setActiveChallenge(null); }} style={{ marginLeft: "auto", fontSize: 11, background: "none", border: "1px solid var(--color-border-tertiary)", borderRadius: 6, padding: "4px 12px", cursor: "pointer", color: "var(--color-text-tertiary)" }}>Close</button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ flex: 1, height: 10, borderRadius: 5, background: "var(--color-border-tertiary)" }}>
                  <div style={{ height: 10, borderRadius: 5, width: clamp(challengeCurrentScore / challengeScore.goal, 0, 1.2) * 100 + "%", background: challengeMet ? "#2d7a4f" : "#BA7517", transition: "width 0.5s" }} />
                </div>
                <span style={{ fontSize: 16, fontWeight: 600, fontFamily: "var(--font-mono)", color: challengeMet ? "#2d7a4f" : "var(--color-text-primary)" }}>{challengeCurrentScore} / {challengeScore.goal} {challengeScore.unit}</span>
              </div>
              {challengeMet && <div style={{ marginTop: 8, fontSize: 13, color: "#2d7a4f", fontWeight: 500 }}>⭐ Amazing work! You changed the future of the Salish Sea.</div>}
            </div>
          )}

          {/* ── FIELD NOTEBOOK — cascade messages ── */}
          {(cascadeMsg || cascadeLog.length > 0) && (
            <div style={{ padding: 10, borderRadius: 10, marginBottom: 10, background: "#FFFBEB", border: "1px solid #F0E4B8" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
                <span style={{ fontSize: 16 }}>📓</span>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#8B6914" }}>Field notebook</span>
                <span style={{ fontSize: 10, color: "#B89A3D" }}>What's changing in the ecosystem</span>
              </div>
              {cascadeMsg && (
                <div style={{ padding: 8, borderRadius: 6, background: "#FFF8D6", marginBottom: cascadeLog.length > 1 ? 6 : 0 }}>
                  {cascadeMsg.map(function(msg, i) {
                    return <div key={i} style={{ fontSize: 12, color: "#5A4A10", marginBottom: 2, lineHeight: 1.4 }}>{"→ " + msg}</div>;
                  })}
                </div>
              )}
              {cascadeLog.length > 1 && (
                <div style={{ maxHeight: 70, overflowY: "auto", fontSize: 10, color: "#8B7A30" }}>
                  {cascadeLog.slice(1).map(function(entry, i) {
                    return <div key={i} style={{ marginBottom: 2, opacity: 0.7 }}><span style={{ fontFamily: "var(--font-mono)", marginRight: 4 }}>{entry.year}</span>{entry.msgs.join(" · ")}</div>;
                  })}
                </div>
              )}
            </div>
          )}

          {/* ── LESSONS (full content, expandable) ── */}
          {!activeChallenge && (
            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6, color: "var(--color-text-secondary)" }}>🔬 Guided investigations</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {LESSONS.map(function(lesson) {
                  var isOpen = activeLesson === lesson.id;
                  return (
                    <div key={lesson.id} style={{ flex: "1 1 180px", padding: isOpen ? "10px 12px" : "10px 12px", borderRadius: 10, border: isOpen ? "2px solid var(--color-text-info)" : "1px solid var(--color-border-tertiary)", background: isOpen ? "var(--color-background-info)" : "var(--color-background-secondary)", cursor: "pointer", transition: "all 0.15s" }}
                      onClick={function() { setActiveLesson(isOpen ? null : lesson.id); }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ fontSize: 20 }}>{lesson.icon}</span>
                        <div>
                          <div style={{ fontSize: 12.5, fontWeight: 600 }}>{lesson.title}</div>
                          <div style={{ fontSize: 11, color: "var(--color-text-secondary)", marginTop: 2, lineHeight: 1.4 }}>{lesson.desc}</div>
                        </div>
                      </div>
                      {isOpen && (
                        <div style={{ marginTop: 8, padding: "8px 10px", borderRadius: 6, background: "rgba(255,255,255,0.5)", border: "1px solid var(--color-border-tertiary)" }}>
                          <div style={{ fontSize: 11, fontWeight: 600, color: "var(--color-text-info)", marginBottom: 4 }}>Try this:</div>
                          <div style={{ fontSize: 11.5, color: "var(--color-text-secondary)", lineHeight: 1.5 }}>{lesson.steps}</div>
                          <button onClick={function(e) { e.stopPropagation(); loadScenario(lesson.scenario); setTab(lesson.tab); setShowWelcome(false); if (!playing) { setPlaying(true); lastTickTime.current = 0; } }} style={{ marginTop: 8, padding: "6px 16px", fontSize: 12, fontWeight: 500, borderRadius: 6, border: "none", cursor: "pointer", background: "var(--color-text-info)", color: "white" }}>🚀 Launch this lesson</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── CHALLENGES ── */}
          {!activeChallenge && (
            <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: "var(--color-text-secondary)" }}>🏆 Challenges:</span>
              {CHALLENGES.map(function(ch) {
                return (
                  <button key={ch.id} onClick={function() { setActiveChallenge(ch.id); loadScenario("baseline"); setShowWelcome(false); }} style={{ padding: "6px 14px", fontSize: 12, borderRadius: 8, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", cursor: "pointer", color: "var(--color-text-secondary)", fontWeight: 500 }}>{ch.icon} {ch.title}</button>
                );
              })}
            </div>
          )}

          {/* ── WHAT HAPPENS IF... (disasters) ── */}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--color-text-secondary)", width: "100%" }}>💥 What happens if...</span>
            {Object.entries(DIS).map(function(entry) {
              var dtype = entry[0], dis = entry[1];
              var labels = { earthquake: "A big earthquake hits?", tsunami: "A tsunami floods the coast?", oilSpill: "Oil spills in the water?", storm: "A huge storm arrives?", atmosphericRiver: "Days of heavy rain?", volcano: "A volcano erupts?", wildfire: "Wildfires burn the forests?" };
              var isActive = shocks[dtype] > 0.05;
              return (
                <button key={dtype} onClick={function() { triggerDisaster(dtype); setShowWelcome(false); if (!playing) { setPlaying(true); lastTickTime.current = 0; } }} style={{
                  padding: "7px 14px", fontSize: 12, borderRadius: 8, cursor: "pointer",
                  border: isActive ? "2px solid " + dis.c : "1px solid var(--color-border-tertiary)",
                  background: isActive ? dis.c + "15" : "var(--color-background-secondary)",
                  color: isActive ? dis.c : "var(--color-text-secondary)", fontWeight: isActive ? 600 : 400, transition: "all 0.2s",
                }}>{dis.ic} {labels[dtype] || dis.l}</button>
              );
            })}
          </div>

          {/* ── TRY THESE SOLUTIONS (policies) ── */}
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: "var(--color-text-secondary)", width: "100%" }}>🛠️ Try these solutions:</span>
            {Object.entries(POL).map(function(entry) {
              var pk = entry[0], pol = entry[1];
              var isAct = !!activePolicies[pk];
              return (
                <button key={pk} onClick={function() { togglePolicy(pk); }} style={{
                  padding: "7px 14px", fontSize: 12, borderRadius: 8, cursor: "pointer",
                  border: isAct ? "2px solid " + pol.c : "1px solid var(--color-border-tertiary)",
                  background: isAct ? pol.c + "15" : "var(--color-background-secondary)",
                  color: isAct ? pol.c : "var(--color-text-secondary)", fontWeight: isAct ? 600 : 400, transition: "all 0.2s",
                }}>{pol.ic} {pol.l}{isAct ? " ✓" : ""}</button>
              );
            })}
          </div>
        </div>
      ) : (
        <div>
          {/* ═══ EXPERT KPI STRIP ═══ */}
          <div style={{ ...DS.cardElevated, padding: "10px 14px", marginBottom: 10 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
            {kpiList.map(function(kpi) {
              var col = healthColor(kpi.value);
              var prev = prevKPIs ? prevKPIs[kpi.key] : null;
              var delta = prev !== null ? kpi.value - prev : 0;
              var arrow = Math.abs(delta) < 0.005 ? "" : delta > 0 ? "↑" : "↓";
              var arrowCol = delta > 0.01 ? DS.good : delta < -0.01 ? DS.danger : "var(--color-text-tertiary)";
              var pct = clamp(kpi.value, 0, 1) * 100;
              return (
                <div key={kpi.key} style={{ textAlign: "center", position: "relative" }}>
                  <div style={{ display: "flex", justifyContent: "center", alignItems: "baseline", gap: 2 }}>
                    <span style={{ fontSize: 22, fontWeight: 600, fontFamily: "var(--font-mono)", color: col, lineHeight: 1, transition: "color 0.5s" }}>{(kpi.value * 100).toFixed(0)}</span>
                    {arrow && <span style={{ fontSize: 11, fontWeight: 600, color: arrowCol }}>{arrow}</span>}
                  </div>
                  <div style={{ fontSize: 9, color: "var(--color-text-tertiary)", marginTop: 4, fontWeight: 500 }}>{kpi.label}</div>
                  {/* Mini bar */}
                  <div style={{ height: 2, borderRadius: 1, background: "var(--color-border-tertiary)", marginTop: 4 }}>
                    <div style={{ height: 2, borderRadius: 1, width: pct + "%", background: col, transition: "width 0.5s, background 0.5s" }} />
                  </div>
                  {prev !== null && Math.abs(delta) >= 0.005 && (
                    <div style={{ fontSize: 8, fontFamily: "var(--font-mono)", color: arrowCol, marginTop: 2 }}>{delta > 0 ? "+" : ""}{(delta*100).toFixed(1)}</div>
                  )}
                </div>
              );
            })}
            </div>
          </div>
          {/* ── BUDGET WARNING ── */}
          {totalPolicyCost > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, padding: "6px 12px", borderRadius: 8, fontSize: 11,
              background: totalPolicyCost > budgetCap ? DS.danger + "08" : "var(--color-background-secondary)",
              border: totalPolicyCost > budgetCap ? "1px solid " + DS.danger + "30" : "1px solid var(--color-border-tertiary)" }}>
              <span style={{ fontWeight: 500, color: totalPolicyCost > budgetCap ? DS.danger : "var(--color-text-secondary)" }}>
                Policy budget: <span style={{ fontFamily: "var(--font-mono)" }}>${totalPolicyCost}M</span>
                {totalPolicyCost > budgetCap && <span> — exceeds ${budgetCap}M threshold</span>}
              </span>
              <span style={{ marginLeft: "auto", fontSize: 9, color: "var(--color-text-tertiary)" }}>
                Threshold: $<input type="number" value={budgetCap} onChange={function(e) { setBudgetCap(Number(e.target.value) || 2000); }}
                  style={{ width: 50, fontSize: 9, fontFamily: "var(--font-mono)", border: "1px solid var(--color-border-tertiary)", borderRadius: 3, padding: "1px 3px", textAlign: "right", background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />M
              </span>
            </div>
          )}
        </div>
      )}

      {/* Events + policies toolbar (expert mode) */}
      {!studentMode && (
      <div style={{ ...DS.cardElevated, padding: "10px 14px", marginBottom: 12 }}>
        <div style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap", marginBottom: 8 }}>
          <span style={{ ...DS.sectionTitle, fontSize: 9 }}>Events</span>
          {Object.entries(DIS).map(function(entry) {
            var dtype = entry[0], dis = entry[1];
            var isActive = shocks[dtype] > 0.05;
            return (
              <button key={dtype} onClick={function() { triggerDisaster(dtype); if (!playing) { setPlaying(true); lastTickTime.current = 0; } }} style={{
                padding: "4px 10px", fontSize: 10, borderRadius: 20, cursor: "pointer", transition: "all 0.15s",
                border: isActive ? "1.5px solid " + dis.c : "1px solid var(--color-border-tertiary)",
                background: isActive ? dis.c + "12" : "transparent",
                color: isActive ? dis.c : "var(--color-text-secondary)", fontWeight: isActive ? 600 : 400,
              }}>{dis.ic} {dis.l}</button>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 3, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ ...DS.sectionTitle, fontSize: 9 }}>Policies</span>
          {Object.entries(POL).map(function(entry) {
            var pk = entry[0], pol = entry[1];
            var isAct = !!activePolicies[pk];
            var isExp = expandedPolicy === pk;
            return (
              <button key={pk}
                onClick={function() { togglePolicy(pk); setExpandedPolicy(null); }}
                onMouseEnter={function() { setExpandedPolicy(pk); }}
                onMouseLeave={function() { setExpandedPolicy(null); }}
                style={{
                padding: "4px 10px", fontSize: 10, borderRadius: 20, cursor: "pointer", transition: "all 0.15s",
                border: isAct ? "1.5px solid " + pol.c : isExp ? "1.5px solid " + pol.c + "60" : "1px solid var(--color-border-tertiary)",
                background: isAct ? pol.c + "12" : isExp ? pol.c + "06" : "transparent",
                color: isAct ? pol.c : "var(--color-text-secondary)", fontWeight: isAct ? 600 : 400,
              }}>{pol.ic} {pol.l}{isAct ? " ✓" : ""}</button>
            );
          })}
          {totalPolicyCost > 0 && <span style={{ fontSize: 9, color: totalPolicyCost > budgetCap ? DS.danger : "var(--color-text-tertiary)", fontFamily: "var(--font-mono)", fontWeight: totalPolicyCost > budgetCap ? 600 : 400, marginLeft: 4 }}>${totalPolicyCost}M{totalPolicyCost > budgetCap ? " ⚠" : ""}</span>}
        </div>
        {/* ── POLICY IMPACT PREVIEW ── */}
        {expandedPolicy && POL[expandedPolicy] && (function() {
            var pk = expandedPolicy, pol = POL[pk];
            var isAct = !!activePolicies[pk];
            var impacts = estimatePolicyImpact(pk, results, effectiveParams);
            var wouldExceed = !isAct && (totalPolicyCost + pol.cost) > budgetCap;
            return (
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", borderRadius: 8, background: pol.c + "06", borderLeft: "3px solid " + pol.c, marginTop: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: pol.c }}>{pol.ic} {pol.l}</span>
                  <span style={{ fontSize: 9.5, fontFamily: "var(--font-mono)", fontWeight: 600, color: wouldExceed ? DS.danger : pol.c }}>${pol.cost}M</span>
                  <span style={{ fontSize: 9, color: "var(--color-text-tertiary)" }}>{pol.yr}yr</span>
                  {wouldExceed && <span style={{ fontSize: 9, color: DS.danger, fontWeight: 600 }}>⚠ over budget</span>}
                </div>
                <div style={{ width: 1, height: 14, background: "var(--color-border-tertiary)", flexShrink: 0 }} />
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", flex: 1, minWidth: 0 }}>
                  {impacts && impacts.map(function(imp) {
                    var col = imp.delta > 0 ? DS.good : DS.danger;
                    return (
                      <span key={imp.label} style={{ display: "inline-flex", alignItems: "center", gap: 2, fontSize: 9, lineHeight: 1, whiteSpace: "nowrap" }}>
                        <span style={{ color: "var(--color-text-tertiary)" }}>{imp.label}</span>
                        <span style={{ color: col, fontWeight: 600, fontFamily: "var(--font-mono)" }}>{imp.delta > 0 ? "+" : ""}{imp.delta.toFixed(1)}</span>
                      </span>
                    );
                  })}
                </div>
                <span style={{ fontSize: 9, color: "var(--color-text-tertiary)", flexShrink: 0, fontStyle: "italic" }}>{isAct ? "remove" : "activate"}</span>
              </div>
            );
          })()}
      </div>
      )}

      {/* Main grid: sidebar + content */}
      <div style={{ display: "grid", gridTemplateColumns: studentMode ? "1fr" : (sidebarOpen ? "210px 1fr" : "36px 1fr"), gap: 10, transition: "grid-template-columns 0.2s" }}>

        {/* LEFT SIDEBAR (hidden in student mode) */}
        {!studentMode && (
        <div style={{ fontSize: 11, overflow: "hidden" }}>
          <button onClick={function() { setSidebarOpen(!sidebarOpen); }} style={{ width: "100%", padding: "4px", fontSize: 10, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", color: "var(--color-text-tertiary)", cursor: "pointer", marginBottom: 6, transition: "all 0.15s" }}>{sidebarOpen ? "< Hide" : ">"}</button>
          {sidebarOpen && (
            <div>
              <div style={{ fontWeight: 500, marginBottom: 4, color: "var(--color-text-secondary)", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em" }}>Parameters</div>
          {Object.entries(PM).map(([modKey, meta]) => (
            <ModulePanel
              key={modKey} moduleKey={modKey} params={effectiveParams[modKey]} meta={meta}
              onChange={handleParamChange} open={openModule === modKey}
              onToggle={() => setOpenModule(openModule === modKey ? null : modKey)}
            />
          ))}

          {/* Active policies (progress indicators + scheduling) */}
          {Object.keys(activePolicies).length > 0 && (
            <div style={{ marginTop: 8 }}>

                  <span style={{ ...DS.sectionTitle, fontSize: 8, marginRight: 2 }}>Basins</span>

                        background: isMPA ? "#1A8A7D15" : "transparent",
                        color: isMPA ? DS.accent : "var(--color-text-tertiary)",

                      </div>

                </div>

                  { label: "Contamination", value: mState.contaminationLevel, max: 1, invert: true },
                  { label: "PCBs (legacy)", value: mState.pcb || 0.12, max: 1, invert: true, color: (mState.pcb||0.12) > 0.3 ? "#993C1D" : "#378ADD" },

                  { label: "HAB risk", value: mState.habIntensity || 0, max: 1, invert: true, color: (mState.habIntensity||0) > 0.5 ? "#993C1D" : "#378ADD" },
                  { label: "Shellfish closure", value: mState.shellfishClosureFrac || 0, max: 1, invert: true },

              {results.marine.basins && (
                <div style={{ padding: 7, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", marginTop: 6 }}>
                  <div style={{ fontSize: 10, fontWeight: 500, marginBottom: 4 }}>Sub-basin conditions</div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 4 }}>
                    {Object.entries(results.marine.basins).map(function(entry) {
                      var bid = entry[0], b = entry[1], bName = BASINS[bid] ? BASINS[bid].name : bid;
                      var doCol = b.DO < 5 ? "#933" : b.DO < 7 ? "#9a6c1e" : "#2d7a4f";
                      return (
                        <div key={bid} style={{ padding: "4px 5px", borderRadius: 4, border: "1px solid var(--color-border-tertiary)", fontSize: 9 }}>
                          <div style={{ fontWeight: 500, fontSize: 9.5, marginBottom: 2 }}>{bName}</div>
                          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--color-text-tertiary)" }}>DO</span><span style={{ fontFamily: "var(--font-mono)", color: doCol, fontWeight: 500 }}>{b.DO.toFixed(1)}</span></div>
                          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--color-text-tertiary)" }}>WQ</span><span style={{ fontFamily: "var(--font-mono)", fontWeight: 500 }}>{(b.wqi * 100).toFixed(0)}%</span></div>
                          <div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ color: "var(--color-text-tertiary)" }}>SST</span><span style={{ fontFamily: "var(--font-mono)" }}>{b.SST.toFixed(1)}</span></div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {/* Species */}
              <div style={{ padding: 7, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", marginTop: 6 }}>
                <div style={{ fontSize: 10, fontWeight: 500, marginBottom: 4 }}>Species & habitats</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 500, fontFamily: "var(--font-mono)", color: (eState.orcaPopulation||74) > 80 ? "#2d7a4f" : "#933" }}>{Math.round(eState.orcaPopulation||74)}</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>SRKW orcas</div></div>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 500, fontFamily: "var(--font-mono)", color: eState.salmonRunStrength > 50 ? "#2d7a4f" : "#933" }}>{eState.salmonRunStrength.toFixed(0)}</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>Salmon run</div></div>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 500, fontFamily: "var(--font-mono)", color: (eState.herringPop||0.5) > 0.5 ? "#2d7a4f" : "#933" }}>{((eState.herringPop||0.5)*100).toFixed(0)}%</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>Herring</div></div>
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 500, fontFamily: "var(--font-mono)", color: (eState.eelgrassHealth||0.5) > 0.5 ? "#2d7a4f" : "#933" }}>{((eState.eelgrassHealth||0.5)*100).toFixed(0)}%</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>Eelgrass</div></div>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 500, fontFamily: "var(--font-mono)", color: (eState.bullKelpHealth||0.5) > 0.5 ? "#2d7a4f" : "#933" }}>{((eState.bullKelpHealth||0.5)*100).toFixed(0)}%</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>Bull kelp</div></div>
                  <div style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 500, fontFamily: "var(--font-mono)", color: (eState.treatyFisheryHealth||0.5) > 0.5 ? "#2d7a4f" : "#933" }}>{((eState.treatyFisheryHealth||0.5)*100).toFixed(0)}%</div><div style={{ fontSize: 8.5, color: "var(--color-text-secondary)" }}>Treaty fisheries</div></div>
                </div>
              </div>
              {/* Food web trophic cascade */}
              <div style={{ padding: 7, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", marginTop: 6 }}>
                <div style={{ fontSize: 10, fontWeight: 500, marginBottom: 6 }}>Food web cascade</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 2, fontSize: 9 }}>
                  {[
                    { label: "Phytoplankton", value: (mState.phyto || 500), max: 1200, color: "#639922" },
                    null,
                    { label: "Zooplankton", value: (mState.zoo || 200), max: 600, color: "#1D9E75" },
                    null,
                    { label: "Herring", value: (eState.herringPop !== undefined ? eState.herringPop : 0.5) * 100, max: 100, color: "#378ADD" },
                    null,
                    { label: "Salmon", value: eState.salmonRunStrength, max: 100, color: "#D85A30" },
                    null,
                    { label: "Orcas", value: eState.orcaPopulation || 75, max: 120, color: "#534AB7" },
                  ].map(function(item, i) {
                    if (!item) return <span key={i} style={{ color: "var(--color-text-tertiary)", fontSize: 12 }}>&#x2192;</span>;
                    var pct = clamp(item.value / item.max, 0, 1);
                    var barH = Math.round(pct * 36) + 6;
                    return (
                      <div key={item.label} style={{ textAlign: "center", flex: 1 }}>
                        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "center", height: 42, marginBottom: 3 }}>
                          <div style={{ width: 18, height: barH, borderRadius: 3, background: item.color, opacity: 0.7, transition: "height 0.5s" }} />
                        </div>
                        <div style={{ fontFamily: "var(--font-mono)", fontWeight: 500, fontSize: 9, color: item.color }}>{Math.round(item.value)}</div>
                        <div style={{ fontSize: 8, color: "var(--color-text-tertiary)", marginTop: 1 }}>{item.label}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>);})()}
            </div>
          )}

          {/* TIMELINE TAB */}
          {tab === "timeline" && (
            <div>
              {history.length > 1 ? (
                <div>
                  <div style={{ padding: "6px 8px", borderRadius: 5, border: "1px solid var(--color-border-tertiary)", marginBottom: 6 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 500, marginBottom: 3 }}>System health</div>
                    <TimelineChart data={history} startYear={history[0]?.year || 2026} series={[
                      { k: "waterQuality", c: "#378ADD", l: "Water quality", max: 1 },
                      { k: "biodiversity", c: "#1D9E75", l: "Biodiversity", max: 1 },
                      { k: "orcaViability", c: "#185FA5", l: "Orca", max: 1 },
                      { k: "orcaPodK", c: "#993C1D", l: "K Pod", max: 30 },
                      { k: "populationHealth", c: "#534AB7", l: "Pop. health", max: 1 },
                    ]} />
                  </div>
                  <div style={{ padding: "6px 8px", borderRadius: 5, border: "1px solid var(--color-border-tertiary)", marginBottom: 6 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 500, marginBottom: 3 }}>Economy and species</div>
                    <TimelineChart data={history} startYear={history[0]?.year || 2026} series={[
                      { k: "employment", c: "#BA7517", l: "Employment", max: 1 },
                      { k: "fisheriesYield", c: "#0F6E56", l: "Fisheries", max: 5000 },
                      { k: "salmonRun", c: "#D85A30", l: "Salmon", max: 100 },
                    ]} />
                  </div>
                  {!studentMode && (
                    <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
                      <button onClick={downloadCSV} style={{ padding: "4px 12px", fontSize: 10, borderRadius: 4, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", color: "var(--color-text-secondary)", cursor: "pointer", fontWeight: 500 }}>⬇ Export CSV ({history.length} rows × {CSV_FLAT_COLS.length + BASIN_IDS.length * BASIN_METRICS.length} cols)</button>
                      <span style={{ fontSize: 9, color: "var(--color-text-tertiary)" }}>Full time series with per-basin data</span>
                    </div>
                  )}
                </div>
              ) : (
                <div style={{ padding: 40, textAlign: "center", color: "var(--color-text-tertiary)", fontSize: studentMode ? 14 : 12 }}>
                  <div style={{ fontSize: 32, marginBottom: 8, opacity: 0.4 }}>{studentMode ? "📈" : "~"}</div>
                  {studentMode ? "Hit ▶ Play and watch the Salish Sea change over time — every line tells a story" : "Press play to start the simulation and watch trends build over time"}
                </div>
              )}
            </div>
          )}

          {/* COMPARE TAB */}
          {tab === "compare" && (
            <div>
              {snapA ? (
                <ComparisonView snapA={snapA} snapB={results} nameA={snapAName} nameB={"Current (" + year + ")"} />
              ) : (
                <div style={{ padding: 40, textAlign: "center", color: "var(--color-text-tertiary)", fontSize: 12 }}>
                  <div style={{ fontSize: 24, marginBottom: 8, opacity: 0.3 }}>A / B</div>
                  {studentMode ? "Switch to Expert mode to use scenario comparison" : "Save a scenario snapshot using the button in the sidebar, then adjust parameters to see the difference"}
                </div>
              )}
            </div>
          )}

          {/* REPORT TAB */}
          {tab === "report" && (
            <div>
              <BriefingView r={results} year={year} params={effectiveParams} policies={activePolicies} />
              {/* Collapsible full text report */}
              <details style={{ marginTop: 12 }}>
                <summary style={{ cursor: "pointer", fontSize: 11, fontWeight: 500, color: "var(--color-text-secondary)", padding: "6px 0" }}>Full text report & data export</summary>
                <div style={{ marginTop: 8 }}>
                  <ReportView r={results} year={year} policies={activePolicies} events={eventLog} />
                  <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
                    <button onClick={downloadCSV} disabled={history.length < 2} style={{ padding: "5px 14px", fontSize: 10.5, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", color: history.length < 2 ? "var(--color-text-tertiary)" : "var(--color-text-secondary)", cursor: history.length < 2 ? "default" : "pointer", fontWeight: 500, opacity: history.length < 2 ? 0.5 : 1 }}>⬇ Download full CSV time series</button>
                    <button onClick={exportCurrentScenario} style={{ padding: "5px 14px", fontSize: 10.5, borderRadius: 5, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)", color: "var(--color-text-secondary)", cursor: "pointer", fontWeight: 500 }}>⬇ Export scenario JSON</button>
                  </div>
                </div>
              </details>
            </div>
          )}

          {/* RESEARCH TAB (expert mode only) */}
          {tab === "research" && (
            <ResearchView r={results} params={effectiveParams} year={year} observedData={observedData} setObservedData={setObservedData} dataFileRef={dataFileRef} />
          )}

          {/* MODEL METHODOLOGY TAB */}
          {tab === "model" && (
            <div>
              {/* ── URBSEA CHARACTERIZATION SCORECARD ── */}
              {(function() {
                var score = computeUrbSeaScore(results, year, effectiveParams);
                var elements = [
                  { key: "Physiography", icon: "🌋", val: score.physiography.label, sub: score.physiography.rating, fixed: true },
                  { key: "Size", icon: "📐", val: score.size.label, sub: score.size.rating, fixed: true },
                  { key: "Age", icon: "📅", val: score.age.label, sub: score.age.rating, fixed: true },
                  { key: "Population", icon: "👥", val: score.population.label, sub: score.population.rating, v: score.population.value / 30 },
                  { key: "Impacts", icon: "⚠️", val: score.impacts.label, sub: score.impacts.rating, v: 1 - score.impacts.value, invert: true },
                  { key: "Economy", icon: "💰", val: score.economy.label + " / " + score.economy.selfSufficiency, sub: score.economy.rating + " • Self-suff: " + (score.economy.selfSuffValue*100).toFixed(0) + "%", v: score.economy.value },
                  { key: "Ecology", icon: "🌿", val: score.ecology.label, sub: score.ecology.rating, v: score.ecology.value },
                  { key: "Significance", icon: "🌐", val: score.significance.label, sub: score.significance.rating, v: score.significance.value },
                ];
                return (
                  <div style={{ marginBottom: 14, padding: "12px 14px", borderRadius: 10, border: "2px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600 }}>Urban Sea System Characterization</div>
                        <div style={{ fontSize: 10, color: "var(--color-text-tertiary)" }}>Greene & Delaney, <span style={{ fontStyle: "italic" }}>Est. Coast. Shelf Sci.</span> 322 (2025) — live scoring</div>
                      </div>
                      <div style={{ fontSize: 20, fontWeight: 600, fontFamily: "var(--font-mono)", color: healthColor(score.composite) }}>{(score.composite*100).toFixed(0)}</div>
                    </div>
                    <div style={{ fontSize: 11, color: "var(--color-text-secondary)", marginBottom: 10, lineHeight: 1.4, fontStyle: "italic" }}>{score.summary}</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 4 }}>
                      {elements.map(function(el) {
                        var col = el.fixed ? "var(--color-text-tertiary)" : el.invert ? stressColor(1 - (el.v || 0.5)) : healthColor(el.v || 0.5);
                        return (
                          <div key={el.key} style={{ textAlign: "center", padding: "6px 4px", borderRadius: 6, border: "1px solid var(--color-border-tertiary)", background: el.fixed ? "transparent" : (col + "08") }}>
                            <div style={{ fontSize: 16 }}>{el.icon}</div>
                            <div style={{ fontSize: 9, fontWeight: 600, color: col, marginTop: 2 }}>{el.val}</div>
                            <div style={{ fontSize: 8, color: "var(--color-text-tertiary)", marginTop: 1 }}>{el.key}</div>
                            {!el.fixed && el.v !== undefined && (
                              <div style={{ height: 3, borderRadius: 2, background: "var(--color-border-tertiary)", marginTop: 3 }}>
                                <div style={{ height: 3, borderRadius: 2, width: cl(el.v,0,1)*100 + "%", background: col, transition: "width 0.5s" }} />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>Model methodology & equations</div>
                  <div style={{ fontSize: 11, color: "var(--color-text-tertiary)", marginTop: 2 }}>Salish Sea Digital Cousin v5 — reference documentation</div>
                </div>
              </div>
              {MODEL_DOC.map(function(doc) {
                return (
                  <div key={doc.section} style={{ marginBottom: 12, padding: "10px 12px", borderRadius: 8, border: "1px solid var(--color-border-tertiary)", background: "var(--color-background-secondary)" }}>
                    <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4, color: doc.section === "Limitations & caveats" ? "#993C1D" : "var(--color-text-primary)" }}>{doc.section}</div>
                    <div style={{ fontSize: 11, color: "var(--color-text-secondary)", lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{doc.content}</div>
                  </div>
                );
              })}
              <div style={{ padding: "8px 12px", borderRadius: 6, background: "var(--color-background-info)", border: "1px solid var(--color-border-tertiary)", fontSize: 10, color: "var(--color-text-info)", lineHeight: 1.5 }}>
                <strong>Citing this model:</strong> Salish Sea Digital Cousin v5, developed with Prof. John Delaney, UW School of Oceanography. Interactive coupled socio-ecological scenario tool. Parameters and calculation details documented above. When publishing results, please include the full parameter configuration (available via scenario JSON export) and note the limitations section.
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SalishSeaTwin));
  </script>
</body>
</html>
